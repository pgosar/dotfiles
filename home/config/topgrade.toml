[misc]
assume_yes = true
disable = []
no_retry = true
pre_sudo = true
cleanup = true
no_self_update = false

[git]
max_concurrency = 10
repos = [
   "~/.local/share/LS_COLORS/"
]

[commands]
# nvm's `install --reinstall-packages-from=node` exits 2 ("Can not reinstall
# packages from the current version of node.") whenever node is already at the
# latest version, which made this step fail on every steady-state run. Only
# migrate global packages when the version actually changed.
"Update Node.js via nvm" = 'source ~/.nvm/nvm.sh && _old="$(nvm version node)" && nvm install node && _new="$(nvm current)" && case "$_old" in v*) [ "$_old" = "$_new" ] || nvm reinstall-packages "$_old";; esac'

[brew]
greedy_cask = true
autoremove = true

[linux]
arch_package_manager = "yay"

[windows]
self_rename = true
